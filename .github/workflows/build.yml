name: Build

on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.3"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Android SDK packages (runner ships an SDK; add what Godot 4.3 needs)
        run: |
          export ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          SM=$(ls $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | $SM --licenses >/dev/null || true
          $SM "platform-tools" "build-tools;34.0.0" "platforms;android-34" "cmdline-tools;latest"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV

      - name: Install Godot + export templates
        run: |
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          curl -sSL -o godot.zip $base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          curl -sSL -o templates.tpz $base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          unzip -q godot.zip && sudo mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          mkdir -p ~/.local/share/godot/export_templates
          unzip -q templates.tpz -d ~/.local/share/godot/export_templates
          mv ~/.local/share/godot/export_templates/templates ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Import project and run unit tests
        run: |
          godot --headless --path . --import || true
          godot --headless --path . --script tests/run_tests.gd

      - name: Android debug keystore + editor settings
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore \
            -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.3.tres <<EOS
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$PWD/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOS
          sed -i 's/^          //' ~/.config/godot/editor_settings-4.3.tres

      - name: Export Web, Windows, Android (debug APK)
        run: |
          tools/export.sh web
          tools/export.sh windows
          tools/export.sh android-debug

      - uses: actions/upload-artifact@v4
        with: { name: kitty-snake-web, path: builds/web }
      - uses: actions/upload-artifact@v4
        with: { name: kitty-snake-windows, path: builds/KittySnake-windows.zip }
      - uses: actions/upload-artifact@v4
        with: { name: kitty-snake-android-debug, path: builds/android/KittySnake-debug.apk }
